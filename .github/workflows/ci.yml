name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build_linux_shipping:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and run tests
      run: make CC=gcc CXX=g++
    - name: Build shared library
      run: make build_shared
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libpg_query-linux-x64
        path: |
          *.a
          *.so
        if-no-files-found: ignore

  build_macos:
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and run tests
      run: make
    - name: Build shared library
      run: make build_shared
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libpg_query-macos
        path: |
          *.a
          *.dylib
        if-no-files-found: ignore

  build_windows_cross:
    name: Cross-compile Windows (mingw-w64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triplet: [x86_64-w64-mingw32]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Build static library (skip running examples/tests)
        env:
          CC: ${{ matrix.triplet }}-gcc
        run: |
          set -euxo pipefail
          make clean
          make build CC=$CC CFLAGS="-O3 -I./src/postgres/include/port/win32 -DWIN32"
      - name: Build DLL (manual link)
        env:
          CC: ${{ matrix.triplet }}-gcc
        run: |
          set -euxo pipefail
          OBJS="$(find src -maxdepth 1 -name '*.o') $(find src/postgres -name '*.o') vendor/protobuf-c/protobuf-c.o vendor/xxhash/xxhash.o protobuf/pg_query.pb-c.o"
          $CC -shared -o libpg_query.dll $OBJS -lws2_32 -lkernel32 -luser32 -ladvapi32 -Wl,--out-implib=libpg_query.dll.a
          # Strip to reduce size (optional)
          ${CC}-strip libpg_query.dll || true
          ls -l libpg_query.dll libpg_query.a libpg_query.dll.a || true
      - name: Upload Windows (mingw) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpg_query-windows-mingw-${{ matrix.triplet }}
          path: |
            libpg_query.a
            libpg_query.dll
            libpg_query.dll.a
          if-no-files-found: error
