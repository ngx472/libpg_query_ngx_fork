name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build_linux:
    name: Build Linux (x64) + upload artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config \
            protobuf-compiler protobuf-c-compiler libprotobuf-c-dev pkgconf

      - name: Build and run tests
        run: |
          set -euxo pipefail
          make clean || true
          make CC=gcc CXX=g++ CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC'

      - name: Build shared library
        run: |
          set -euxo pipefail
          # explicitly build the shared target so we get libpg_query.so
          make build_shared CC=gcc CXX=g++ CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC' || (make build CC=gcc CXX=g++ CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC' && true)

      - name: Prepare artifacts layout (Linux)
        run: |
          set -euxo pipefail
          rm -rf artifacts || true
          mkdir -p artifacts/libpg_query-linux-x64/lib
          mkdir -p artifacts/libpg_query-linux-x64/include
          # copy libs (adjust names/paths if Makefile differs)
          if [ -f libpg_query.so ]; then cp libpg_query.so artifacts/libpg_query-linux-x64/lib/ || true; fi
          if [ -f libpg_query.a ];  then cp libpg_query.a artifacts/libpg_query-linux-x64/lib/ || true; fi
          # copy include/ tree if present in repo/build
          if [ -d include ]; then cp -a include artifacts/libpg_query-linux-x64/; fi
          # also copy headers that live under src/include and src/postgres/include
          if [ -d src/include ]; then mkdir -p artifacts/libpg_query-linux-x64/include && cp -a src/include/* artifacts/libpg_query-linux-x64/include/ || true; fi
          if [ -d src/postgres/include ]; then mkdir -p artifacts/libpg_query-linux-x64/include/postgres && cp -a src/postgres/include/* artifacts/libpg_query-linux-x64/include/postgres/ || true; fi
          if [ -d protobuf ]; then mkdir -p artifacts/libpg_query-linux-x64/include/protobuf && cp -a protobuf/*.h artifacts/libpg_query-linux-x64/include/protobuf/ || true; fi
          # also copy any vendor protobuf-c headers if needed (best-effort)
          if [ -d vendor/protobuf-c/include ]; then cp -a vendor/protobuf-c/include/* artifacts/libpg_query-linux-x64/include/ || true; fi
          # ensure root headers required by JNI consumers are included
          if [ -f pg_query.h ]; then cp pg_query.h artifacts/libpg_query-linux-x64/include/ || true; fi
          if [ -f postgres_deparse.h ]; then cp postgres_deparse.h artifacts/libpg_query-linux-x64/include/ || true; fi
          # also include the vendor protobuf-c single header and source as requested
          if [ -f vendor/protobuf-c/protobuf-c.h ]; then mkdir -p artifacts/libpg_query-linux-x64/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.h artifacts/libpg_query-linux-x64/include/vendor/protobuf-c/ || true; fi
          if [ -f vendor/protobuf-c/protobuf-c.c ]; then mkdir -p artifacts/libpg_query-linux-x64/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.c artifacts/libpg_query-linux-x64/include/vendor/protobuf-c/ || true; fi
          ls -la artifacts/libpg_query-linux-x64 || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpg_query-linux-x64
          path: artifacts/libpg_query-linux-x64
          if-no-files-found: ignore

  build_macos:
    name: Build macOS (x64/arm depending runner) + upload artifacts
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install build deps (macOS)
        run: |
          # Using Homebrew on macOS runner
          brew update || true
          brew install protobuf-c pkg-config || true

      - name: Build and run tests (macOS)
        run: |
          set -euxo pipefail
          make clean || true
          # pass -fPIC so object files are position independent for linking into dylibs if needed
          make CC=clang CXX=clang++ CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC'

      - name: Build shared library (macOS)
        run: |
          set -euxo pipefail
          # explicitly build the shared target so we get libpg_query.dylib
          make build_shared CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC' || (make build CFLAGS='-O2 -fPIC' CXXFLAGS='-O2 -fPIC' && true)

      - name: Prepare artifacts layout (macOS)
        run: |
          set -euxo pipefail
          rm -rf artifacts || true
          mkdir -p artifacts/libpg_query-macos/lib
          mkdir -p artifacts/libpg_query-macos/include
          if [ -f libpg_query.dylib ]; then cp libpg_query.dylib artifacts/libpg_query-macos/lib/ || true; fi
          if [ -f libpg_query.a ];     then cp libpg_query.a artifacts/libpg_query-macos/lib/ || true; fi
          if [ -d include ]; then cp -a include artifacts/libpg_query-macos/; fi
          # copy additional header locations
          if [ -d src/include ]; then mkdir -p artifacts/libpg_query-macos/include && cp -a src/include/* artifacts/libpg_query-macos/include/ || true; fi
          if [ -d src/postgres/include ]; then mkdir -p artifacts/libpg_query-macos/include/postgres && cp -a src/postgres/include/* artifacts/libpg_query-macos/include/postgres/ || true; fi
          if [ -d protobuf ]; then mkdir -p artifacts/libpg_query-macos/include/protobuf && cp -a protobuf/*.h artifacts/libpg_query-macos/include/protobuf/ || true; fi
          # ensure root headers required by JNI consumers are included
          if [ -f pg_query.h ]; then cp pg_query.h artifacts/libpg_query-macos/include/ || true; fi
          if [ -f postgres_deparse.h ]; then cp postgres_deparse.h artifacts/libpg_query-macos/include/ || true; fi
          # also include the vendor protobuf-c single header and source as requested
          if [ -f vendor/protobuf-c/protobuf-c.h ]; then mkdir -p artifacts/libpg_query-macos/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.h artifacts/libpg_query-macos/include/vendor/protobuf-c/ || true; fi
          if [ -f vendor/protobuf-c/protobuf-c.c ]; then mkdir -p artifacts/libpg_query-macos/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.c artifacts/libpg_query-macos/include/vendor/protobuf-c/ || true; fi
          ls -la artifacts/libpg_query-macos || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpg_query-macos
          path: artifacts/libpg_query-macos
          if-no-files-found: ignore

  build_windows_cross:
    name: Cross-compile Windows (mingw-w64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triplet: [x86_64-w64-mingw32]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 pkg-config

      - name: Build static library (cross compile)
        env:
          CC: ${{ matrix.triplet }}-gcc
          AR: ${{ matrix.triplet }}-ar
          RANLIB: ${{ matrix.triplet }}-ranlib
          OS: Windows_NT
        run: |
          set -euxo pipefail
          # Build objects deterministically via the Makefile so both .a and .dll use the same objects.
          make clean || true
          make CC=${{ matrix.triplet }}-gcc AR=true RANLIB=true CFLAGS='-O3 -DWIN32 -fPIC' CXXFLAGS='-O3 -DWIN32 -fPIC' build

          # Collect only library objects (avoid test/example artifacts). Use the canonical source/vendor dirs.
          OBJ_ROOTS=(src src/postgres vendor protobuf)
          FOUND=false
          for D in "${OBJ_ROOTS[@]}"; do
            if [ -d "$D" ] && [ -n "$(find "$D" -type f -name '*.o' -print -quit)" ]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = false ] && [ -z "$(find . -type f -name '*.o' -print -quit)" ]; then
            echo "No object files found after make; aborting" >&2
            exit 1
          fi

          echo "Creating libpg_query.a from object files under src/, vendor/ and protobuf/"
          # Use explicit, non-overlapping find calls to avoid duplicates (src includes src/postgres)
          # Use null-delimited pipeline to avoid issues with file names
          (
            find src -maxdepth 1 -type f -name '*.o' -print0 2>/dev/null || true
            find src/postgres -maxdepth 1 -type f -name '*.o' -print0 2>/dev/null || true
            find vendor/protobuf-c -maxdepth 1 -type f -name '*.o' -print0 2>/dev/null || true
            find vendor/xxhash -maxdepth 1 -type f -name '*.o' -print0 2>/dev/null || true
            find protobuf -maxdepth 1 -type f -name '*.o' -print0 2>/dev/null || true
          ) | xargs -0 ${{ matrix.triplet }}-ar rcs libpg_query.a
          # Fallback: if above found nothing, pack any .o in repo
          if [ ! -f libpg_query.a ] || [ ! -s libpg_query.a ]; then
            echo "Primary object roots produced no archive; falling back to any .o files"
            find . -type f -name '*.o' -not -path './.git/*' -print0 | xargs -0 ${{ matrix.triplet }}-ar rcs libpg_query.a
          fi
          if command -v ${{ matrix.triplet }}-ranlib >/dev/null 2>&1; then
            ${{ matrix.triplet }}-ranlib libpg_query.a || true
          fi
          ls -l libpg_query.a || true

      - name: Build DLL (cross link)
        env:
          CC: ${{ matrix.triplet }}-gcc
          OS: Windows_NT
        run: |
          set -euxo pipefail
          # Collect the same object files used for the static archive (prefer src/vendor/protobuf)
          OBJS="$( (find src -maxdepth 1 -type f -name '*.o' -print 2>/dev/null || true; find src/postgres -maxdepth 1 -type f -name '*.o' -print 2>/dev/null || true; find vendor/protobuf-c -maxdepth 1 -type f -name '*.o' -print 2>/dev/null || true; find vendor/xxhash -maxdepth 1 -type f -name '*.o' -print 2>/dev/null || true; find protobuf -maxdepth 1 -type f -name '*.o' -print 2>/dev/null || true) | tr '\n' ' ' )"
          # Fallback: include any .o if the above didn't return anything
          if [ -z "$OBJS" ]; then
            OBJS="$(find . -type f -name '*.o' -print | tr '\n' ' ')"
          fi
           # Link DLL and create import lib
           $CC -shared -o libpg_query.dll $OBJS -lws2_32 -lkernel32 -luser32 -ladvapi32 -Wl,--out-implib=libpg_query.dll.a
           # produce libpg_query.a if the build created it
           ls -l libpg_query.dll libpg_query.a libpg_query.dll.a || true

      - name: Verify / create static archive (libpg_query.a)
        env:
          AR: ${{ matrix.triplet }}-ar
          RANLIB: ${{ matrix.triplet }}-ranlib
          OS: Windows_NT
        run: |
          set -euxo pipefail
          echo "Checking for libpg_query.a"
          if [ -f libpg_query.a ]; then
            echo "libpg_query.a already exists"
          else
            # Try to create from the object directory produced by manual compile
            if [ -d build_mingw_objs ]; then
              OBJ_FILES=$(find build_mingw_objs -type f -name '*.o' -print | tr '\n' ' ')
              if [ -n "$(find build_mingw_objs -type f -name '*.o' -print -quit)" ]; then
                echo "Creating libpg_query.a from build_mingw_objs"
                find build_mingw_objs -type f -name '*.o' -print0 | xargs -0 $AR rcs libpg_query.a
                if command -v $RANLIB >/dev/null 2>&1; then $RANLIB libpg_query.a || true; fi
              fi
            fi
            # If still not present, try to use any import lib produced by the link step
            if [ ! -f libpg_query.a ]; then
              if [ -f libpg_query.dll.a ]; then
                echo "No static archive created; using import lib libpg_query.dll.a as libpg_query.a"
                cp libpg_query.dll.a libpg_query.a || true
              else
                # find any matching import lib in the tree
                IMP="$(find . -type f -name 'libpg_query.dll.a' -print -quit || true)"
                if [ -n "$IMP" ]; then
                  echo "Found import lib: $IMP; copying as libpg_query.a"
                  cp "$IMP" libpg_query.a || true
                fi
              fi
            fi
          fi
          if [ ! -f libpg_query.a ]; then
            echo "ERROR: libpg_query.a not found after attempts to create/copy" >&2
            # list candidates for debugging
            find . -type f -name 'libpg_query*.a' -or -name 'libpg_query.dll*' -ls || true
            exit 1
          fi
          ls -l libpg_query.a || true

      - name: Prepare artifacts layout (Windows)
        run: |
          set -euxo pipefail
          rm -rf artifacts || true
          mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib
          mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include
          # Prefer the true static archive if present, otherwise also collect any import libs
          FOUND_STATIC="$(find . -type f -name 'libpg_query.a' -print -quit || true)"
          if [ -n "$FOUND_STATIC" ]; then
            echo "Found static archive: $FOUND_STATIC"
            cp "$FOUND_STATIC" artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib/ || true
          else
            echo "No libpg_query.a found; copying available libpg_query*.a as fallback (may be import lib)"
            find . -type f -name 'libpg_query*.a' -exec cp {} artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib/ \; || true
            # If only an import lib (libpg_query.dll.a) exists, copy it as libpg_query.a so consumers have an .a filename
            IMP_LIB="$(find . -type f -name 'libpg_query.dll.a' -print -quit || true)"
            if [ -n "$IMP_LIB" ] && [ ! -f artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib/libpg_query.a ]; then
              echo "No true static lib; using import lib as libpg_query.a fallback: $IMP_LIB"
              cp "$IMP_LIB" artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib/libpg_query.a || true
            fi
          fi
          if [ -f libpg_query.dll ]; then cp libpg_query.dll artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/lib/ || true; fi
          if [ -d include ]; then cp -a include artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/; fi
          # copy additional header locations
          if [ -d src/include ]; then mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include && cp -a src/include/* artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/ || true; fi
          if [ -d src/postgres/include ]; then mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/postgres && cp -a src/postgres/include/* artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/postgres/ || true; fi
          if [ -d protobuf ]; then mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/protobuf && cp -a protobuf/*.h artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/protobuf/ || true; fi
          # ensure root headers required by JNI consumers are included
          if [ -f pg_query.h ]; then cp pg_query.h artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/ || true; fi
          if [ -f postgres_deparse.h ]; then cp postgres_deparse.h artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/ || true; fi
          # also include the vendor protobuf-c single header and source as requested
          if [ -f vendor/protobuf-c/protobuf-c.h ]; then mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.h artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/vendor/protobuf-c/ || true; fi
          if [ -f vendor/protobuf-c/protobuf-c.c ]; then mkdir -p artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/vendor/protobuf-c && cp vendor/protobuf-c/protobuf-c.c artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}/include/vendor/protobuf-c/ || true; fi
          ls -la artifacts/libpg_query-windows-mingw-${{ matrix.triplet }} || true

      - name: "Debug: list built files (Windows)"
        run: |
          set -euxo pipefail
          echo "PWD: $(pwd)"
          echo "Listing top-level files:"
          ls -la || true
          echo "Finding libpg_query*.a, *.o, dlls (recursive):"
          find . -type f \( -iname 'libpg_query*.a' -o -iname '*.o' -o -iname 'libpg_query.dll*' \) -ls || true
          echo "Printing tree (depth 3):"
          find . -maxdepth 3 -ls || true

      - name: Upload Windows (mingw) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpg_query-windows-mingw-${{ matrix.triplet }}
          path: artifacts/libpg_query-windows-mingw-${{ matrix.triplet }}
          if-no-files-found: error
